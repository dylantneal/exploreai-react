<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A2E"/>
      <stop offset="100%" style="stop-color:#0D0D1A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00BFFF"/>
      <stop offset="100%" style="stop-color:#1B204C"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="url(#bg)"/>
  
  <!-- Network nodes representing data connections -->
  <circle cx="8" cy="10" r="2" fill="#00BFFF" opacity="0.7"/>
  <circle cx="24" cy="8" r="1.5" fill="#00BFFF" opacity="0.5"/>
  <circle cx="20" cy="22" r="2" fill="#00BFFF" opacity="0.6"/>
  <circle cx="6" cy="24" r="1.5" fill="#00BFFF" opacity="0.5"/>
  
  <!-- Connection lines -->
  <line x1="8" y1="10" x2="16" y2="16" stroke="#00BFFF" stroke-width="0.5" opacity="0.4"/>
  <line x1="24" y1="8" x2="16" y2="16" stroke="#00BFFF" stroke-width="0.5" opacity="0.4"/>
  <line x1="20" y1="22" x2="16" y2="16" stroke="#00BFFF" stroke-width="0.5" opacity="0.4"/>
  <line x1="6" y1="24" x2="16" y2="16" stroke="#00BFFF" stroke-width="0.5" opacity="0.4"/>
  
  <!-- Central "clarity" point - bright and clear -->
  <circle cx="16" cy="16" r="5" fill="url(#accent)"/>
  <circle cx="16" cy="16" r="3" fill="#00BFFF"/>
  <circle cx="16" cy="16" r="1.5" fill="#FFFFFF"/>
</svg>

